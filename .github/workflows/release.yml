name: Release

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Ocelot 子模組指向私有的 org 鏡像，沒有這顆 token 會在 checkout 階段
          # 以 404（不是 403）失敗，錯誤訊息看起來像網址打錯。
          token: ${{ secrets.PRIVATE_SUBMODULE_TOKEN || github.token }}
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/ffxiv-tc-port/DalamudPluginsTC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\xivlauncher\Addon\Hooks\dev\"
      - name: Compute version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v'
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build with dotnet
        run: dotnet build --configuration Release BOCCHI/BOCCHI.csproj -p:DalamudLibPath="$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\" -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }}
      - name: write version into manifest
        shell: pwsh
        run: |
          $path = './BOCCHI/bin/Release/BOCCHI/BOCCHI.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: Rename artifact to BOCCHI.zip
        shell: pwsh
        run: |
          # Explicit path, not a recursive search: this repo checks out a submodule,
          # and a stray latest.zip anywhere else would silently ship instead.
          Copy-Item "./BOCCHI/bin/Release/BOCCHI/latest.zip" -Destination "BOCCHI.zip"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            BOCCHI.zip
            BOCCHI/bin/Release/BOCCHI/BOCCHI.json
          generate_release_notes: true
